<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 12px 14px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #e3e7eb;
      background: #24272c;
    }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

      margin-top: 8px;
      font-size: 11px;
      color: #98a1ab;
    }
  </style>
</head>
<body>
  <label>
    <input type="checkbox" id="toggle" checked>
    <span>Dark mode for TP LMS</span>
  </label>
  <div class="sub">Applies to tplms.polite.edu.sg</div>
  <script src="popup.js"></script>
</body>
</html>
